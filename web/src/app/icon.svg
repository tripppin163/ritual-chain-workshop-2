<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" shape-rendering="crispEdges">
<!--
  The Ritual mark, traced from the supplied cutout so it stays sharp at every size.

  It carries no ground: a filled tile would show as a box in the tab strip. That leaves
  colour to do the work of staying visible, so the mark follows the browser's theme —
  near-black against a light strip, the site's own off-white against a dark one. A single
  fixed colour would disappear on one of the two.

  crispEdges turns anti-aliasing off. At 16 and 32 pixels the mark's interlacing is finer
  than a smoothed edge can hold and it greys into a smudge; drawn as hard pixels it stays
  a definite shape. The geometry is all 45 degrees and straight runs, which suits it.
-->
<style>
path { fill: #0a0a0a; }
@media (prefers-color-scheme: dark) { path { fill: #fafaf9; } }
</style>
